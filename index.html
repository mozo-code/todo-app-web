<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>To do list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1 id="title">My To-Do List</h1>
        
        <input type="text" id="taskinput" placeholder="Enter a task">
        <div id="align">
            <button type="button" id="addtaskbtn">Add task</button>
            <button type="button" id="bomb">Delete Everything</button>
        </div>

        <p id="message"></p>

        <p>Total tasks: <span id="tasknb">0</span></p>

        <ul id="tasklist"></ul>

        <p>Completed tasks: <span id="compnb">0</span></p>
        
        <ul id="completedlist"></ul>
        
    </div>


    <script src="script.js"></script>
</body>


</html>
